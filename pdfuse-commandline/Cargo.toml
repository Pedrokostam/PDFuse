[package]
name = "pdfuse-commandline"
version = "0.1.0"
edition = "2024"

[dependencies]
pdfuse-sizing = { path = "../pdfuse-sizing" }
pdfuse-utils = { path = "../pdfuse-utils" }
tabled.workspace = true
pdfuse-parameters = { path = "../pdfuse-parameters" }
clap = { workspace = true, features = ["color","cargo","unicode","wrap_help","usage","help","error-context","suggestions","string"] }
log.workspace = true
serde.workspace=true
toml = { workspace=true, features = ["preserve_order"] }
indoc.workspace = true
color-print.workspace = true
rust-i18n.workspace = true
chrono.workspace = true

[lints]
workspace = true

[package.metadata.i18n]
available-locales = ["en", "pl"]
default-locale = "en"
load-path = "../locales"

[dev-dependencies]
serde_json.workspace = true
