[package.metadata.i18n]
available-locales = ["en", "pl"]
default-locale = "en"
load-path = "locales"

[profile.dev]
# opt-level=1
[profile.dev.package."*"]
opt-level=3
#debug=true
#split-debuginfo="unpacked"

