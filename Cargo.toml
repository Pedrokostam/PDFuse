[package]
name = "pdfuse"
version = "0.9.0"
edition = "2024"
[workspace]
resolver = "2"
members = [ 
"pdfuse-commandline",
    "pdfuse-merging",
    "pdfuse-parameters",
    "pdfuse-sizing",
    "pdfuse-utils",
]

[workspace.dependencies]
log = "0.4.28"
indicatif = {version= "0.18.0", features = ["rayon"]}
rust-i18n = "3.1.5"
serde = { version = "1.0.228", features = ["derive"] }
once_cell = "1.21.3"
rayon = "1.11.0"
regex = "1.12.1"
anyhow = "1.0.100"
tabled = "0.20.0"
printpdf = { version = "0.8.2", features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "pnm",
    "tga",
    "tiff",
    "webp",
    "ico",
] }

[workspace.lints.clippy]



[dependencies]
pdfuse-sizing = { path = "pdfuse-sizing" }
pdfuse-utils = { path = "pdfuse-utils" }
pdfuse-merging = { path = "pdfuse-merging" }
pdfuse-parameters = { path = "pdfuse-parameters" }
pdfuse-commandline = { path = "pdfuse-commandline" }
clap = { version = "4.5.48", features = ["derive"] }
color-print = "0.3.7"
lopdf = "0.38.0"
rust-i18n.workspace = true
walkdir = "2.5.0"
tabled.workspace = true
printpdf = { workspace = true }
anyhow = { workspace = true }
image = "0.25.8"
dashmap = "6.1.0"
rayon = "1.11.0"
indicatif.workspace = true
log.workspace = true
regex = {workspace = true}
dirs = "6.0.0"
toml = "0.9.8"
serde_json = "1.0.145"

[package.metadata.i18n]
available-locales = ["en", "pl"]
default-locale = "en"
load-path = "locales"

[profile.release]
strip = true
lto = "thin"


[profile.dev]
# opt-level=1
[profile.dev.package."*"]
opt-level=3
#debug=true
#split-debuginfo="unpacked"

